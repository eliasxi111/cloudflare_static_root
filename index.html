<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heimserver</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-hover: #22262f;
    --text: #e8e9ec;
    --muted: #8b8f9a;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }
  h1 {
    font-size: 1.8rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 48px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 800px;
  }
  a.card {
    background: var(--card);
    border-radius: 14px;
    padding: 22px 20px;
    text-decoration: none;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 14px;
    transition: background 0.15s ease, transform 0.15s ease;
    border: 1px solid #2a2e38;
  }
  a.card:hover {
    background: var(--card-hover);
    transform: translateY(-2px);
  }
  .icon {
    font-size: 1.5rem;
  }
  .label {
    font-weight: 500;
  }
  .section-title {
    width: 100%;
    max-width: 800px;
    color: var(--muted);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 36px 0 12px 4px;
  }
  .section-title:first-of-type { margin-top: 0; }
</style>
</head>
<body>

  <h1>Heimserver</h1>
  <p class="subtitle">Übersicht meiner Services</p>

  <div class="section-title">Allgemein</div>
  <div class="grid">
    <a class="card" href="https://gallery.notacreativedomain.top">
      <span class="icon">🖼️</span>
      <span class="label">Gallery</span>
    </a>
    <a class="card" href="https://share.notacreativedomain.top">
      <span class="icon">📁</span>
      <span class="label">Fileshare</span>
    </a>
  </div>

  <div class="section-title">Dashboards</div>
  <div class="grid">
    <a class="card" href="https://dash.notacreativedomain.top/Dashboards/cookingX4.html">
      <span class="icon">📊</span>
      <span class="label">Kochen</span>
    </a>
    <a class="card" href="https://dash.notacreativedomain.top/Dashboards/kalender.html">
      <span class="icon">📊</span>
      <span class="label">Kalender</span>
    </a>
    <a class="card" href="https://dash.notacreativedomain.top/Dashboards/wetterstation%20(9).html">
      <span class="icon">📊</span>
      <span class="label">Wetter</span>
    </a>
    <a class="card" href="https://dash.notacreativedomain.top/Dashboards/wochenplan.html">
      <span class="icon">📊</span>
      <span class="label">Wochenplan</span>
    </a>
    <a class="card" href="https://dash.notacreativedomain.top/Dashboards/gewohnheiten-tracker.html">
      <span class="icon">📊</span>
      <span class="label">Gewohnheiten</span>
    </a>
    <a class="card" href="https://dash.notacreativedomain.top/Dashboards/capture.html">
      <span class="icon">📊</span>
      <span class="label">Zettel</span>
    </a>
  </div>

</body>
</html>
